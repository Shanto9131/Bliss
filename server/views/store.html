<a class="skip" href="#main">Skip to content</a>
<div class="announce"><div class="container announce-in"><svg class="i" aria-hidden="true"><use href="#i-sparkle"></use></svg><span id="announce-text">{{announce}}</span></div></div>
<header class="hdr" id="hdr">
  <div class="container hdr-in">
    <button type="button" class="ibtn only-mobile" data-act="open-menu" aria-label="Open menu"><svg class="i" aria-hidden="true"><use href="#i-menu"></use></svg></button>
    <a href="/" class="logo"><img class="logo-img" src="/img/brand/bliss-logo.svg" alt="{{store:name}} home" width="140" height="50"></a>
    <nav class="nav" aria-label="Main">
      <a href="/shop" data-nav="shop">Shop all</a>
      <div class="nav-dd">
        <button type="button" class="nav-dd-btn" aria-haspopup="true">Categories <svg class="i" aria-hidden="true"><use href="#i-chev-down"></use></svg></button>
        <div class="mega"><div class="mega-cats" id="mega-cats"></div><div class="mega-side"><h4>Shop by occasion</h4><div class="mega-occ" id="mega-occ"></div><a class="mega-cta" href="/gift-box-builder">Can't decide? <b>Build a gift box →</b></a></div></div>
      </div>
      <a href="/gift-box-builder" data-nav="builder">Gift Box Builder</a>
      <a href="/category/gift-boxes" data-nav="cat-gift-boxes">Ready to Gift</a>
      <a href="/corporate" data-nav="corporate">Corporate</a>
      <a href="/track" data-nav="track">Track Order</a>
    </nav>
    <div class="hdr-actions">
      <button type="button" class="search-pill" data-act="open-search" aria-label="Search gifts"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg><span>Search gifts…</span><kbd>/</kbd></button>
      <button type="button" class="ibtn search-ibtn" data-act="open-search" aria-label="Search"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg></button>
      <a href="/account" class="ibtn hide-mobile" aria-label="Account"><svg class="i" aria-hidden="true"><use href="#i-user"></use></svg><span id="hdr-account-label" class="sr">Account</span></a>
      <a href="/wishlist" class="ibtn hide-mobile" aria-label="Wishlist"><svg class="i" aria-hidden="true"><use href="#i-heart"></use></svg><b class="badge-count" data-badge="wish" hidden></b></a>
      <button type="button" class="ibtn bag-btn" data-act="open-cart" aria-label="Open bag"><svg class="i" aria-hidden="true"><use href="#i-bag"></use></svg><b class="badge-count" data-badge="cart" hidden></b></button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1"><div class="boot-loader" aria-hidden="true"><span></span></div></main>
<footer class="ftr" id="ftr"></footer>
<nav class="tabbar" aria-label="Quick links">
  <a href="/" data-nav="home"><svg class="i" aria-hidden="true"><use href="#i-home"></use></svg><span>Home</span></a>
  <a href="/shop" data-nav="shop"><svg class="i" aria-hidden="true"><use href="#i-grid"></use></svg><span>Shop</span></a>
  <button type="button" data-act="open-search"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg><span>Search</span></button>
  <a href="/wishlist" data-nav="wishlist"><svg class="i" aria-hidden="true"><use href="#i-heart"></use></svg><span>Wishlist</span><b class="badge-count" data-badge="wish" hidden></b></a>
  <button type="button" data-act="open-cart"><svg class="i" aria-hidden="true"><use href="#i-bag"></use></svg><span>Bag</span><b class="badge-count" data-badge="cart" hidden></b></button>
</nav>
<div id="layers"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
